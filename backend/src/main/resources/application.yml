server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/hostel_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: hostel-management-secret-key-that-is-at-least-256-bits-long-for-hs256
    expiration: 86400000
